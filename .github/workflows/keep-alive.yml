name: HF Spaces Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping qwen-api-relay
        run: curl -s -o /dev/null -w "%{http_code}" https://whatcc-qwen-api-relay.hf.space/health

      - name: Ping qwen2api-go
        run: curl -s -o /dev/null -w "%{http_code}" https://whatcc-qwen2api-go.hf.space/models
