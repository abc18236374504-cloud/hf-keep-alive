name: HF Space Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping qwen-api-relay
        run: curl -sS --max-time 30 https://whatcc-qwen-api-relay.hf.space/health
      - name: Ping qwen2api
        run: curl -sS --max-time 30 https://whatcc-qwen2api.hf.space/v1/models -H "Authorization: Bearer an123456"
